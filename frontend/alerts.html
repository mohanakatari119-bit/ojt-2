<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts — API Monitor</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="sidebar-root"></div>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">Alerts</span>
    <button class="btn btn-sm btn-primary" onclick="showModal()">New rule</button>
  </div>

  <div class="content">
    <div id="notice"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
      <div>
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:14px;">Alert Rules</div>
        <div id="alert-list"><div style="text-align:center;padding:24px;"><span class="spinner"></span></div></div>
      </div>
      <div>
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:14px;">Recent Events</div>
        <div id="event-list"><div style="text-align:center;padding:24px;"><span class="spinner"></span></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; align-items:center; justify-content:center;">
  <div class="card" style="width:460px; max-width:95vw;">
    <div class="flex-between mb-16">
      <h3 style="font-size:15px;">New Alert Rule</h3>
      <button class="btn btn-sm btn-secondary" onclick="hideModal()">Close</button>
    </div>
    <div id="modal-notice"></div>

    <div class="field">
      <label>Service ID</label>
      <input id="a-service" type="text" placeholder="UUID" />
    </div>

    <div class="field">
      <label>Rule name</label>
      <input id="a-name" type="text" placeholder="5xx spike" />
    </div>

    <div class="field">
      <label>Description <span style="color:var(--muted); text-transform:none; letter-spacing:0;">(optional)</span></label>
      <input id="a-desc" type="text" />
    </div>

    <div style="display:grid; grid-template-columns:1fr 90px 1fr; gap:10px; margin-bottom:14px;">
      <div class="field" style="margin-bottom:0;">
        <label>Field</label>
        <select id="a-field" style="width:100%;">
          <option value="status_code">status_code</option>
          <option value="latency_ms">latency_ms</option>
          <option value="error">error</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Operator</label>
        <select id="a-op" style="width:100%;">
          <option>&gt;=</option><option>&lt;=</option><option>==</option>
          <option>!=</option><option>&gt;</option><option>&lt;</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Value</label>
        <input id="a-val" type="text" placeholder="500" />
      </div>
    </div>

    <button class="btn btn-primary w-full" onclick="createAlert()" style="justify-content:center;">
      Create rule
    </button>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  guardAuth();
  document.getElementById('sidebar-root').innerHTML = buildSidebar('alerts');

  function showModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
  function hideModal() { document.getElementById('modal-overlay').style.display = 'none'; }

  async function loadAlerts() {
    try {
      const alerts = await apiFetch('/v1/alerts');
      const el = document.getElementById('alert-list');
      if (!alerts.length) {
        el.innerHTML = '<div class="card"><div class="empty"><p>No alert rules yet</p></div></div>';
        return;
      }
      el.innerHTML = alerts.map(a => `
        <div class="card mb-12">
          <div class="flex-between mb-8">
            <strong style="font-size:13px;">${a.name}</strong>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="badge ${a.is_active ? 'badge-green' : 'badge-gray'}">${a.is_active ? 'active' : 'paused'}</span>
              <button class="btn btn-sm btn-danger" onclick="deleteAlert('${a.id}')">Delete</button>
            </div>
          </div>
          ${a.description ? `<div class="text-muted mb-8" style="font-size:12px;">${a.description}</div>` : ''}
          <div class="mono" style="font-size:12px; display:flex; align-items:center; gap:6px;">
            <span class="badge badge-blue">${a.condition_field}</span>
            <span class="text-muted">${a.condition_operator}</span>
            <span class="badge badge-yellow">${a.condition_value}</span>
          </div>
        </div>
      `).join('');
    } catch(e) {
      showNotice(document.getElementById('notice'), e.message);
    }
  }

  async function loadEvents() {
    try {
      const events = await apiFetch('/v1/alerts/events/recent?limit=30');
      const el = document.getElementById('event-list');
      if (!events.length) {
        el.innerHTML = '<div class="card"><div class="empty"><p>No events triggered</p></div></div>';
        return;
      }
      el.innerHTML = events.map(ev => `
        <div class="card mb-12" style="padding:12px 16px;">
          <div class="flex-between mb-6">
            <span class="badge badge-red">triggered</span>
            <span class="text-muted" style="font-size:11px;">${relTime(ev.triggered_at)}</span>
          </div>
          <div style="font-size:12px; color:var(--text); margin-bottom:6px;">${ev.message}</div>
          <a href="/log/${ev.log_id}" style="font-size:11px; color:var(--accent);">View log</a>
        </div>
      `).join('');
    } catch(e) {
      showNotice(document.getElementById('notice'), e.message);
    }
  }

  async function deleteAlert(id) {
    if (!confirm('Delete this rule?')) return;
    try {
      await apiFetch(`/v1/alerts/${id}`, { method: 'DELETE' });
      loadAlerts();
    } catch(e) {
      showNotice(document.getElementById('notice'), e.message);
    }
  }

  async function createAlert() {
    const notice = document.getElementById('modal-notice');
    const body = {
      service_id: document.getElementById('a-service').value.trim(),
      name: document.getElementById('a-name').value.trim(),
      description: document.getElementById('a-desc').value.trim() || null,
      condition_field: document.getElementById('a-field').value,
      condition_operator: document.getElementById('a-op').value,
      condition_value: document.getElementById('a-val').value.trim(),
    };
    if (!body.service_id || !body.name || !body.condition_value) {
      showNotice(notice, 'Service ID, name, and value are required.'); return;
    }
    try {
      await apiFetch('/v1/alerts', { method: 'POST', body: JSON.stringify(body) });
      hideModal();
      loadAlerts();
    } catch(e) {
      showNotice(notice, e.message);
    }
  }

  loadAlerts();
  loadEvents();
</script>
</body>
</html>
