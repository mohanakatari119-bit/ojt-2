<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Detail — API Monitor</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="sidebar-root"></div>

<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="topbar-title">Log Detail</span>
    <div style="display:flex; gap:8px;">
      <a href="/dashboard" class="btn btn-sm btn-secondary">Back to Logs</a>
      <a id="replay-btn" href="#" class="btn btn-sm btn-primary">Replay</a>
    </div>
  </div>

  <div class="content">
    <div id="notice"></div>
    <div id="detail-root">
      <div style="text-align:center; padding:64px;"><span class="spinner"></span></div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  guardAuth();
  document.getElementById('sidebar-root').innerHTML = buildSidebar('logs');

  const logId = window.location.pathname.split('/').pop();
  document.getElementById('replay-btn').href = `/replay/${logId}`;

  async function loadDetail() {
    try {
      const log = await apiFetch(`/v1/logs/${logId}`);
      document.getElementById('topbar-title').textContent =
        `${log.method} ${log.path}`;

      document.getElementById('detail-root').innerHTML = `
        <div class="stat-grid mb-24">
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div>${statusBadge(log.status_code)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Latency</div>
            <div>${latencyBadge(log.latency_ms)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Method</div>
            <div>${methodPill(log.method)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Captured</div>
            <div class="mono" style="font-size:13px;">${new Date(log.captured_at).toLocaleString()}</div>
          </div>
        </div>

        <div class="card mb-16">
          <div class="card-title">Request</div>
          <div class="mb-8"><span class="text-muted">URL: </span><span class="mono">${log.url}</span></div>
          ${log.source_ip ? `<div class="mb-8"><span class="text-muted">Source IP: </span><span class="mono">${log.source_ip}</span></div>` : ''}
          ${log.tags?.length ? `<div class="mb-8">${log.tags.map(t=>`<span class="badge badge-purple">${t}</span>`).join(' ')}</div>` : ''}
          ${log.query_params && Object.keys(log.query_params).length ? `
            <div class="card-title" style="margin-top:16px;">Query Params</div>
            <pre>${fmtJSON(log.query_params)}</pre>` : ''}
          <div class="card-title" style="margin-top:16px;">Request Headers</div>
          <pre>${fmtJSON(log.request_headers) || '—'}</pre>
          <div class="card-title" style="margin-top:16px;">Request Body</div>
          <pre>${log.request_body ? fmtJSON(log.request_body) : '<span style="color:var(--muted)">empty</span>'}</pre>
        </div>

        <div class="card mb-16">
          <div class="card-title">Response</div>
          ${log.error ? `<div class="notice notice-error mb-16"><strong>Error:</strong> ${log.error}</div>` : ''}
          <div class="card-title">Response Headers</div>
          <pre>${fmtJSON(log.response_headers) || '—'}</pre>
          <div class="card-title" style="margin-top:16px;">Response Body</div>
          <pre>${log.response_body ? fmtJSON(log.response_body) : '<span style="color:var(--muted)">empty</span>'}</pre>
        </div>

        <div class="card">
          <div class="card-title">Log ID</div>
          <span class="mono text-muted">${log.id}</span>
        </div>
      `;
    } catch(e) {
      showNotice(document.getElementById('notice'), e.message);
    }
  }

  loadDetail();
</script>
</body>
</html>
